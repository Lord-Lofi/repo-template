# Keeps dependencies up to date with weekly pull requests.
# Add an entry for the project's package manager, for example:
#   - package-ecosystem: "maven"     (Java / Maven)
#   - package-ecosystem: "gradle"    (Java / Gradle)
#   - package-ecosystem: "npm"       (JavaScript)
#   - package-ecosystem: "pip"       (Python)
#
# Groups keep the number of pull requests down:
#   - security: all security fixes for an ecosystem in one pull request
#   - minor-and-patch: routine minor and patch updates in one pull request
# Major version updates still get their own pull request, because they can
# need code changes. Copy the groups block into any entry you add.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
