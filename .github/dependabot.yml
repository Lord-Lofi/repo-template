# Keeps dependencies up to date with weekly pull requests.
# Add an entry for the project's package manager, for example:
#   - package-ecosystem: "maven"     (Java / Maven)
#   - package-ecosystem: "gradle"    (Java / Gradle)
#   - package-ecosystem: "npm"       (JavaScript)
#   - package-ecosystem: "pip"       (Python)
#
# Each entry has a "security" group, which combines that ecosystem's security
# fixes into one pull request instead of one per package. Copy the groups
# block into any entry you add.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
